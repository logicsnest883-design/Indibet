<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IndiBet{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a { color: inherit; text-decoration: none; }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: #111c33;
            border-bottom: 1px solid #1e293b;
        }
        .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: 1px; }
        .logo span { color: #22c55e; }
        .nav-links { display: flex; gap: 12px; align-items: center; }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            border: 2px solid #22c55e;
            cursor: pointer;
        }
        .btn-primary { background: #22c55e; color: #0f172a; }
        .btn-outline { background: transparent; color: #22c55e; }

        .balance {
            background: #0f172a;
            border: 1px solid #22c55e;
            color: #22c55e;
            padding: 6px 14px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.95rem;
        }

        main { flex: 1; }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 24px; }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
            color: #94a3b8;
            border-top: 1px solid #1e293b;
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <header class="navbar">
        <a href="/" class="logo">Indi<span>Bet</span></a>
        <nav class="nav-links">
            {% block nav %}
            {% if user.is_authenticated %}
                <a href="{% url 'wallet:wallet' %}" class="balance" title="Available balance">K {{ user.wallet.available|floatformat:2 }}</a>
                <span>Hi, {{ user.username }}</span>
                <form method="post" action="{% url 'accounts:logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline" style="font-size:1rem;">Log out</button>
                </form>
            {% else %}
                <a href="{% url 'accounts:login' %}" class="btn btn-outline">Log in</a>
                <a href="{% url 'accounts:signup' %}" class="btn btn-primary">Sign up</a>
            {% endif %}
            {% endblock %}
            <a href="{% url 'matches:lobby' %}" class="btn btn-primary">Play</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 IndiBet. 18+ only. Play responsibly.</p>
    </footer>
</body>
</html>
